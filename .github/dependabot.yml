# Dependency updates for npm and GitHub Actions.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: build(deps)
    groups:
      # TypeScript and its type packages are updated together.
      typescript:
        patterns:
          - typescript
          - "@types/*"
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: build(deps)
